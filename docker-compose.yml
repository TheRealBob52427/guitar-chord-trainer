services:
  guitar-trainer:
    build:
      context: .
    image: guitar-chord-trainer:1.2.0
    container_name: guitar-chord-trainer
    ports:
      - "8080:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    tmpfs:
      - /var/cache/nginx
      - /var/run
