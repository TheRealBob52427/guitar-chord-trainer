server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Kompression für Text-Assets
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        application/xml;

    # Sicherheits-Header (gelten für alle Locations ohne eigenes add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Service Worker und HTML nie lange cachen, damit Updates ankommen.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location = /manifest.json {
        types { application/manifest+json json; }
        expires 1h;
    }

    location ~* \.(?:css|js)$ {
        # Keine langen HTTP-Caches für unversionierte Assets: sonst können
        # Service-Worker-Updates bis zu einer Stunde alte JS-Dateien sehen.
        expires -1;
    }

    location ~* \.(?:png|svg|ico|webmanifest)$ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
